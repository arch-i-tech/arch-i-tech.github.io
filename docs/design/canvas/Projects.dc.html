<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arch-I-Tech — Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#161616;text-decoration:none}a:hover{color:#8B1818}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #161616; background: #F4F2EE; min-height: 100vh">

  <header style="max-width: 1360px; margin: 0 auto; padding: 1.75rem 2.5rem; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem 2rem">
    <a href="Main.dc.html" style="display: flex; align-items: center; padding: 0.25rem 0"><img src="/_blob/6196cfe39ffd1e57e306c369bd3f376c" alt="Arch-I-Tech Ltd — home" style="width: 19.5rem; max-width: 100%; height: auto; display: block"></a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 0.25rem 2.5rem; font-size: 0.9375rem; font-weight: 500; letter-spacing: 0.04em">
      <a href="Projects.dc.html" aria-current="page" style="padding: 0.75rem 0; box-shadow: inset 0 -2px 0 {{accent}}">Projects</a>
      <a href="About.dc.html" style="padding: 0.75rem 0">About</a>
    </nav>
  </header>

  <section style="max-width: 1360px; margin: 0 auto; padding: 4.5rem 2.5rem 2.5rem; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1.5rem 4rem">
    <h1 style="margin: 0; font-family: 'Inter Tight', sans-serif; font-weight: 300; font-size: clamp(2.5rem, 5vw, 4.5rem); line-height: 1; letter-spacing: -0.03em">Projects</h1>
    <p style="margin: 0; max-width: 30rem; font-size: 1rem; line-height: 1.65; color: #4A4744">Master plans, buildings, landscapes and interiors — designed and visualized by our studio for clients across five continents.</p>
  </section>

  <section style="max-width: 1360px; margin: 0 auto; padding: 0 2.5rem 6rem">
    <div role="group" aria-label="Filter projects by discipline" style="display: flex; flex-wrap: wrap; gap: 0.5rem; padding: 1.25rem 0; margin-bottom: 2.5rem; border-top: 1px solid #D6D1C9; border-bottom: 1px solid #D6D1C9">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="6">
        <sc-if value="{{f.on}}" hint-placeholder-val="{{ false }}">
          <button type="button" aria-pressed="true" onClick="{{f.pick}}" style="min-height: 2.75rem; padding: 0 1.25rem; border: 1px solid #161616; background: #161616; color: #FFFFFF; font: 500 0.875rem Inter, sans-serif; cursor: pointer">{{f.label}}</button>
        </sc-if>
        <sc-if value="{{f.off}}" hint-placeholder-val="{{ true }}">
          <button type="button" aria-pressed="false" onClick="{{f.pick}}" style="min-height: 2.75rem; padding: 0 1.25rem; border: 1px solid #C9C3BA; background: transparent; color: #161616; font: 500 0.875rem Inter, sans-serif; cursor: pointer">{{f.label}}</button>
        </sc-if>
      </sc-for>
      <span style="margin-left: auto; align-self: center; font-size: 0.875rem; color: #5E5B57">{{countLabel}}</span>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 3.5rem 2rem">
      <sc-for list="{{shown}}" as="p" hint-placeholder-count="9">
        <a href="Project.dc.html" style="display: flex; flex-direction: column; gap: 1rem">
          <div style="overflow: hidden; aspect-ratio: 4 / 3; background: #E2DED7">
            <img src="{{p.img}}" alt="{{p.alt}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
          </div>
          <div style="display: flex; flex-direction: column; gap: 0.375rem">
            <span style="font-size: 0.75rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #6A6560">{{p.cat}}</span>
            <span style="font-family: 'Inter Tight', sans-serif; font-size: 1.375rem; font-weight: 500; letter-spacing: -0.01em; line-height: 1.25">{{p.title}}</span>
            <span style="font-size: 0.9375rem; color: #5E5B57">{{p.place}}</span>
          </div>
        </a>
      </sc-for>
    </div>

    <div style="display: flex; justify-content: center; padding-top: 4.5rem">
      <button type="button" style="min-height: 3.25rem; padding: 0 2rem; border: 1px solid #161616; background: transparent; color: #161616; font: 600 0.9375rem Inter, sans-serif; cursor: pointer">Load more projects</button>
    </div>
  </section>

  <footer style="background: #161616; color: #EDEBE7">
    <div style="max-width: 1360px; margin: 0 auto; padding: 2.5rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.5rem; font-size: 0.875rem">
      <span style="font-family: 'Inter Tight', sans-serif; font-weight: 600; letter-spacing: 0.18em">ARCH-I-TECH</span>
      <span style="color: #A9A49D">© 2026 Arch-I-Tech Ltd. All rights reserved.</span>
    </div>
  </footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8B1818","options":["#8B1818","#161616","#2F4A3A","#7A5A2E"]},"$preview":{"width":1440,"height":2500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All' };
  }
  renderVals() {
    const all = [
      { title: 'AL-Brayeh City', place: 'Southern Kuwait · 35M m²', cat: 'Master Planning', tags: ['Master Planning', 'Architecture', 'Landscape'], img: '/_blob/1d7635e88f155f5b13d2008030f67a55', alt: 'Aerial view of AL-Brayeh City master plan' },
      { title: 'Ocean Lake Resort', place: 'Loíza, Puerto Rico', cat: 'Hospitality · Resort', tags: ['Hospitality', 'Master Planning', 'Architecture', 'Landscape'], img: '/_blob/db6fbaad1f89952b08cd100f95f54dfa', alt: 'Lagoon and condo-hotel terraces at Ocean Lake Resort' },
      { title: 'Silverlight Gardens', place: 'Bronx River, New York', cat: 'Wellness · Landscape', tags: ['Landscape', 'Master Planning', 'Architecture'], img: '/_blob/cab06a6a1d8f6da6d0fac97220aaf844', alt: 'Silverlight Gardens wellness campus' },
      { title: 'Quebrada de Bicho Prieto', place: 'Lima, Peru · 320 ha', cat: 'Master Planning', tags: ['Master Planning', 'Landscape'], img: '/_blob/b6f954dc915059ba2f4b740f04bdc219', alt: 'Quebrada de Bicho Prieto residential master plan' },
      { title: 'Via De La Paz', place: 'Pacific Palisades, Los Angeles', cat: 'Residence · Interiors', tags: ['Architecture', 'Interiors', 'Landscape'], img: '/_blob/184a1052f5158d05000ed82b14aecd67', alt: 'Mediterranean Revival residence street view' },
      { title: 'Gallya Grove', place: 'New Jersey', cat: 'Residential Landscape', tags: ['Landscape'], img: '/_blob/83c768eb1ef4406bd5b39ea211573c98', alt: 'Gallya Grove garden terrace' },
      { title: 'Museum, Sports & Amusement Park', place: 'Kelowna, Canada · 2023', cat: 'Public Park', tags: ['Master Planning', 'Architecture', 'Landscape'], img: '/_blob/fcb0e2d37681e64924bd698ca5d407e2', alt: 'Museum and amusement park complex in Kelowna' },
      { title: 'Residence on a Slope', place: 'California, USA · 2017', cat: 'Residence', tags: ['Architecture', 'Interiors', 'Landscape'], img: '/_blob/d5caed6132db470875c621f5dcb9d95f', alt: 'Hillside residence with pool' },
      { title: 'Glamping Eco Village', place: 'Durmitor, SE Europe · 2021', cat: 'Hospitality · Master Planning', tags: ['Hospitality', 'Master Planning'], img: '/_blob/9ceffc200af2579d88dd8e67cc630308', alt: 'Glamping eco-village in the mountains' }
    ];
    const labels = ['All', 'Master Planning', 'Architecture', 'Landscape', 'Hospitality', 'Interiors'];
    const current = this.state.filter;
    const filters = labels.map((label) => ({
      label,
      on: label === current,
      off: label !== current,
      pick: () => this.setState({ filter: label })
    }));
    const shown = current === 'All' ? all : all.filter((p) => p.tags.indexOf(current) !== -1);
    return {
      accent: this.props.accent ?? '#8B1818',
      filters,
      shown,
      countLabel: shown.length + (shown.length === 1 ? ' project' : ' projects')
    };
  }
}
</script>
</body>
</html>
